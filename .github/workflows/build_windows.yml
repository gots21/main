name: Build Windows EXE

on:
  push:
    branches: [ "claude/search-automation-app-qEyof" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager PyQt6 pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "search_bot" search_bot.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search_bot_windows
          path: dist/search_bot.exe
          retention-days: 30
