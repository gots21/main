name: Build

on:
  push:
    branches: [ "claude/search-automation-app-qEyof" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install selenium webdriver-manager PyQt6 pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name "search_bot"
          --collect-all selenium --collect-all webdriver_manager
          search_bot.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search_bot_windows
          path: dist/search_bot.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install selenium webdriver-manager PyQt6 pyinstaller

      - name: Build APP
        run: >
          pyinstaller --onefile --windowed --name "search_bot"
          --collect-all selenium --collect-all webdriver_manager
          search_bot.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search_bot_macos
          path: dist/search_bot
          retention-days: 30
